name: Run TikTok Scraper Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Decrypt auth.json
        env:
          ENC_PASS: ${{ secrets.ENCRYPTION_PASSWORD }}
        run: |
          node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const [ivHex, encrypted] = fs.readFileSync('auth.json.enc', 'utf8').split(':');
          const key = crypto.scryptSync(process.env.ENC_PASS, 'salt', 32);
          const decipher = crypto.createDecipheriv('aes-256-cbc', key, Buffer.from(ivHex, 'hex'));
          let decrypted = decipher.update(encrypted, 'hex', 'utf8');
          decrypted += decipher.final('utf8');
          fs.writeFileSync('auth.json', decrypted);
          "

      - name: Run scraping script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrape.js
